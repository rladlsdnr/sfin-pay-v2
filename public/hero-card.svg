<svg viewBox="20 132 780 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SFIN PAY 통합 결제 카드">
  <defs>
    <linearGradient id="faceG" x1="180" y1="170" x2="660" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c79bff"/>
      <stop offset="0.45" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="edgeG" x1="180" y1="430" x2="660" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d54d6"/>
      <stop offset="1" stop-color="#3b5fd6"/>
    </linearGradient>
    <linearGradient id="edgeG2" x1="600" y1="220" x2="700" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5fe0"/>
      <stop offset="1" stop-color="#3f63d8"/>
    </linearGradient>
    <linearGradient id="backG" x1="120" y1="120" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bb0ff"/>
      <stop offset="0.5" stop-color="#6c8bff"/>
      <stop offset="1" stop-color="#5566e8"/>
    </linearGradient>
    <linearGradient id="chipG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ff"/>
      <stop offset="0.4" stop-color="#cfc8ee"/>
      <stop offset="0.62" stop-color="#efeaff"/>
      <stop offset="1" stop-color="#bcb4df"/>
    </linearGradient>
    <linearGradient id="sheen" x1="200" y1="180" x2="520" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tagG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#5b3fd0" flood-opacity="0.34"/>
    </filter>
    <filter id="softSm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5b3fd0" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 분위기 글로우 -->
  <ellipse cx="430" cy="380" rx="360" ry="320" fill="url(#glow)"/>
  <ellipse cx="610" cy="250" rx="220" ry="200" fill="url(#glow2)"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="430" cy="600" rx="280" ry="46" fill="#5b3fd0" opacity="0.18"/>

  <!-- ===== 뒤 카드 (쿨 블루, 스택 깊이) ===== -->
  <g transform="rotate(-12 360 300)" opacity="0.96">
    <rect x="120" y="150" width="430" height="270" rx="34" fill="url(#backG)" filter="url(#softSm)"/>
    <rect x="120" y="150" width="430" height="270" rx="34" fill="url(#sheen)"/>
    <circle cx="492" cy="196" r="4" fill="#ffffff" opacity="0.8"/>
    <path d="M468 188a26 26 0 0 1 0 18M480 184a36 36 0 0 1 0 26" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <rect x="156" y="340" width="200" height="12" rx="6" fill="#ffffff" opacity="0.34"/>
    <rect x="156" y="364" width="130" height="12" rx="6" fill="#ffffff" opacity="0.24"/>
  </g>

  <!-- ===== 앞 카드 (주인공) ===== -->
  <g transform="rotate(7 430 360)" filter="url(#soft)">
    <!-- 두께(엣지) -->
    <path d="M250 226h430a28 28 0 0 1 28 28v236a28 28 0 0 1-28 28H250a28 28 0 0 1-28-28V254a28 28 0 0 1 28-28z" fill="url(#edgeG)" transform="translate(0,16)"/>
    <!-- 표면 -->
    <rect x="222" y="226" width="486" height="292" rx="30" fill="url(#faceG)"/>
    <rect x="222" y="226" width="486" height="292" rx="30" fill="url(#sheen)"/>
    <!-- 상단: 로고 워드마크 + 컨택리스 -->
    <g transform="translate(258 262)">
      <circle cx="16" cy="16" r="16" fill="#ffffff" opacity="0.22"/>
      <text x="14" y="22" font-family="Pretendard, Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
      <text x="44" y="22" font-family="Pretendard, Inter, sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" fill="#ffffff">SFIN PAY</text>
    </g>
    <g transform="translate(636 266)">
      <circle cx="6" cy="14" r="4.4" fill="#ffffff"/>
      <path d="M-18 4a30 30 0 0 1 0 20M-6 -2a42 42 0 0 1 0 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 칩 -->
    <g transform="translate(258 312)">
      <rect width="58" height="44" rx="10" fill="url(#chipG)"/>
      <path d="M19 0v44M39 0v44M0 15h58M0 29h58" stroke="#8b7cc0" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="19" y="15" width="20" height="14" rx="3" fill="none" stroke="#8b7cc0" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <!-- 카드번호 -->
    <text x="258" y="436" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#ffffff" opacity="0.96">5402 ···· ···· 4921</text>
    <!-- 하단: 홀더 + 망 마크 -->
    <text x="258" y="476" font-family="Pretendard, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#ffffff" opacity="0.7">CARD HOLDER</text>
    <text x="258" y="496" font-family="Pretendard, Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">SFIN MERCHANT</text>
    <circle cx="636" cy="486" r="18" fill="#ffffff" opacity="0.30"/>
    <circle cx="664" cy="486" r="18" fill="#ffffff" opacity="0.55"/>
    <!-- 정반사 -->
    <path d="M222 226h150l-90 292h-30a30 30 0 0 1-30-30z" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- ===== 결제 승인 태그 (글래스) ===== -->
  <g filter="url(#softSm)">
    <rect x="296" y="566" width="278" height="64" rx="20" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="296" y="566" width="278" height="64" rx="20" fill="none" stroke="#8b6cff" stroke-opacity="0.22"/>
    <circle cx="332" cy="598" r="17" fill="url(#tagG)"/>
    <path d="M324 598l5 5 9-10" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="362" y="592" font-family="Pretendard, Inter, sans-serif" font-size="12" font-weight="600" fill="#5b6478">결제 승인</text>
    <text x="362" y="616" font-family="Pretendard, Inter, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5" fill="#0b1a3a">₩1,250,000</text>
    <text x="528" y="600" font-family="Pretendard, Inter, sans-serif" font-size="13" font-weight="800" fill="#7c6bff">D+0</text>
  </g>

  <!-- ===== 플로팅 토큰 ===== -->
  <!-- QR 토큰 -->
  <g filter="url(#softSm)" transform="translate(96 300)">
    <rect width="92" height="92" rx="22" fill="#ffffff" fill-opacity="0.92"/>
    <rect width="92" height="92" rx="22" fill="none" stroke="#8b6cff" stroke-opacity="0.2"/>
    <g transform="translate(22 22)" fill="url(#tagG)">
      <rect width="14" height="14" rx="2"/><rect x="20" width="8" height="8" rx="1.5"/><rect x="34" width="14" height="14" rx="2"/>
      <rect y="20" width="8" height="8" rx="1.5"/><rect x="22" y="22" width="6" height="6"/><rect x="40" y="20" width="8" height="8" rx="1.5"/>
      <rect y="34" width="14" height="14" rx="2"/><rect x="22" y="36" width="6" height="6"/><rect x="34" y="34" width="14" height="14" rx="2"/>
    </g>
  </g>
  <!-- ₩ 코인 -->
  <g filter="url(#softSm)" transform="translate(690 430)">
    <circle cx="40" cy="40" r="40" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="40" cy="40" r="40" fill="none" stroke="#8b6cff" stroke-opacity="0.2"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="url(#tagG)" stroke-width="2" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="40" y="52" font-family="Pretendard, Inter, sans-serif" font-size="34" font-weight="800" fill="url(#tagG)" text-anchor="middle">₩</text>
  </g>
  <!-- 보안 락 토큰 -->
  <g filter="url(#softSm)" transform="translate(650 150)">
    <rect width="74" height="74" rx="20" fill="#ffffff" fill-opacity="0.92"/>
    <rect width="74" height="74" rx="20" fill="none" stroke="#8b6cff" stroke-opacity="0.2"/>
    <g transform="translate(25 22)" stroke="url(#tagG)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="13" width="24" height="18" rx="4" fill="url(#tagG)" stroke="none"/>
      <path d="M4 13v-4a8 8 0 0 1 16 0v4"/>
      <circle cx="12" cy="21" r="2.4" fill="#ffffff" stroke="none"/>
    </g>
  </g>

  <!-- 연결 흐름선 -->
  <path d="M150 320 C 230 280 280 300 300 360" stroke="#8b6cff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.5" fill="none"/>
  <path d="M690 220 C 640 280 640 320 600 360" stroke="#8b6cff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.45" fill="none"/>
  <path d="M700 460 C 660 440 630 430 600 430" stroke="#4f7cff" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.45" fill="none"/>

  <!-- 스파클 -->
  <g fill="#a855f7">
    <circle cx="210" cy="170" r="4" opacity="0.7"/>
    <circle cx="600" cy="560" r="5" opacity="0.55"/>
    <circle cx="120" cy="470" r="4" opacity="0.5"/>
    <circle cx="740" cy="330" r="3.5" opacity="0.6"/>
  </g>
</svg>
