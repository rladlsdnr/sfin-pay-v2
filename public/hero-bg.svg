      <stop offset="0" stop-color="#c79bff"/><stop offset="0.45" stop-color="#8b6cff"/><stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="bgEdge" x1="560" y1="560" x2="980" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d54d6"/><stop offset="1" stop-color="#3b5fd6"/>
